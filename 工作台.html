<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f14;
    --bg-elevated: #141922;
    --bg-subtle: #1a2030;
    --bg-input: #11161f;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.14);
    --text: #eef2f7;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #6ea8fe;
    --accent-soft: rgba(110,168,254,.12);
    --accent-glow: rgba(110,168,254,.28);
    --coral: #ff8a65;
    --coral-soft: rgba(255,138,101,.12);
    --success: #34d399;
    --success-soft: rgba(52,211,153,.12);
    --warning: #fbbf24;
    --warning-soft: rgba(251,191,36,.12);
    --danger: #f87171;
    --danger-soft: rgba(248,113,113,.12);
    --violet: #a78bfa;
    --violet-soft: rgba(167,139,250,.12);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-xs: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 12px 40px rgba(0,0,0,.42);
    --font: "Inter", "Noto Sans TC", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(110,168,254,.14), transparent),
      radial-gradient(ellipse 60% 40% at 100% 0%, rgba(167,139,250,.08), transparent),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ── Header ── */
  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .hero-brand { display: flex; align-items: center; gap: 14px; }
  .hero-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-soft), var(--violet-soft));
    border: 1px solid var(--border-strong);
    display: grid; place-items: center;
    font-size: 22px;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .hero h1 {
    margin: 0 0 2px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hero .sub {
    margin: 0;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .metrics {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .metric {
    min-width: 96px;
    padding: 12px 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
  }
  .metric-val {
    display: block;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }
  .metric-label {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .metric.open .metric-val { color: var(--coral); }
  .metric.done .metric-val { color: var(--success); }
  .metric.note .metric-val { color: var(--violet); }

  /* ── Shell ── */
  .shell {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .seg-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 12px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
  }
  .seg-tab {
    flex: 1;
    max-width: 200px;
    padding: 10px 16px;
    border: none;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text-secondary);
    font: 500 13px/1 var(--font);
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .seg-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .seg-tab.active {
    color: var(--text);
    background: var(--bg-elevated);
    box-shadow: var(--shadow);
  }

  .panel { padding: 20px; }
  .view { display: none; }
  .view.active { display: block; }
  .subview { display: none; }
  .subview.active { display: block; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 180px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-wrap input { padding-left: 36px !important; }

  input[type=text], select, textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-xs);
    padding: 10px 12px;
    font: 14px/1.4 var(--font);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  select { cursor: pointer; min-width: 120px; width: auto; }
  .filterselect { width: auto; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 16px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-xs);
    background: var(--bg-subtle);
    color: var(--text);
    font: 500 13px/1 var(--font);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover { background: #222a38; border-color: rgba(255,255,255,.2); }
  .btn:active { transform: scale(.98); }
  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: #0c0f14;
    font-weight: 600;
  }
  .btn.primary:hover { background: #8bb8ff; }
  .btn.ghost { background: transparent; color: var(--text-secondary); }
  .btn.ghost:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 7px; }
  .btn.danger { color: var(--danger); border-color: rgba(248,113,113,.35); background: var(--danger-soft); }
  .btn.danger:hover { background: rgba(248,113,113,.2); }
  .btn.back { color: var(--accent); border-color: rgba(110,168,254,.3); background: var(--accent-soft); }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 14px; }
  .chip {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--text-secondary);
    font: 500 12px/1 var(--font);
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active {
    background: var(--accent-soft);
    border-color: rgba(110,168,254,.4);
    color: var(--accent);
  }

  /* ── Forms ── */
  .form-panel {
    display: none;
    margin-bottom: 20px;
    padding: 20px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .form-panel.open { display: block; }
  .form-title {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-panel textarea { min-height: 72px; resize: vertical; }
  .form-panel textarea.code { font-family: var(--mono); font-size: 13px; min-height: 140px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .form-hint { margin-top: 8px; font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .check-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-secondary); cursor: pointer;
  }
  .check-label input { width: auto; accent-color: var(--accent); }

  /* ── Empty ── */
  .empty {
    text-align: center;
    padding: 56px 24px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,.02);
  }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: .5; }

  /* ── Project cards ── */
  .proj-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .proj-card {
    text-align: left;
    width: 100%;
    padding: 18px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color .2s, transform .15s, box-shadow .2s;
  }
  .proj-card:hover {
    border-color: rgba(110,168,254,.35);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  .proj-card .pname {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .proj-card .pct {
    font-size: 12px;
    font-weight: 500;
    color: var(--success);
    background: var(--success-soft);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .proj-card .pcounts {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .proj-card .pcounts b { font-weight: 600; }
  .proj-card .pcounts .open b { color: var(--coral); }
  .proj-card .pcounts .done-count b { color: var(--success); }
  .progress-bar {
    height: 5px;
    background: rgba(255,255,255,.06);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar > span {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* ── Detail header ── */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .detail-header h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  .detail-header .dcount {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--mono);
    padding: 4px 10px;
    background: var(--bg-subtle);
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  /* ── Issue / Note cards ── */
  .card-list { display: flex; flex-direction: column; gap: 10px; }

  .card {
    position: relative;
    padding: 16px 18px 14px 22px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: border-color .15s, opacity .15s;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--text-muted);
  }
  .card.status-open::before { background: var(--danger); }
  .card.status-progress::before { background: var(--warning); }
  .card.status-done::before { background: var(--success); }
  .card.note-card::before { background: var(--violet); }
  .card:hover { border-color: var(--border-strong); }
  .card.resolved { opacity: .65; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }
  .caseid {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .04em;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    word-break: break-word;
  }
  .card.resolved .card-title {
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
    color: var(--text-secondary);
  }
  .card-note {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-wrap;
    margin-bottom: 12px;
    word-break: break-word;
  }

  .badge {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .badge.open { background: var(--danger-soft); color: var(--danger); }
  .badge.progress { background: var(--warning-soft); color: var(--warning); }
  .badge.done { background: var(--success-soft); color: var(--success); }
  .badge.warn { background: var(--danger-soft); color: var(--danger); font-family: var(--mono); }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag {
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    font-family: var(--mono);
  }
  .tag.cat { background: rgba(255,255,255,.05); color: var(--text-secondary); }
  .tag.pri-high { background: var(--danger-soft); color: var(--danger); }
  .tag.pri-med { background: var(--warning-soft); color: var(--warning); }
  .tag.pri-low { background: var(--success-soft); color: var(--success); }
  .tag.ntag { background: var(--violet-soft); color: var(--violet); }

  .card-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .card-date {
    margin-right: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .codeblock {
    margin-bottom: 12px;
    padding: 14px 16px;
    background: #080a0f;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    font-family: var(--mono);
    font-size: 12.5px;
    color: #a8b4c8;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow: auto;
  }

  /* ── Toast & Modal ── */
  .toast-wrap {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    padding: 12px 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-xs);
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    opacity: 0;
    transform: translateY(10px) scale(.96);
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateY(0) scale(1); }
  .toast.ok { border-color: rgba(52,211,153,.4); color: var(--success); }
  .toast.err { border-color: rgba(248,113,113,.4); color: var(--danger); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(6px);
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: min(400px, 100%);
    padding: 24px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  .modal h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .modal p { margin: 0 0 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 720px) {
    .app { padding: 16px 14px 64px; }
    .hero { flex-direction: column; }
    .metrics { width: 100%; }
    .metric { flex: 1; }
    .seg-tab { max-width: none; }
    .form-row { grid-template-columns: 1fr; }
    .toolbar .btn, .toolbar select { width: 100%; }
    .card-actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-brand">
      <div class="hero-icon" aria-hidden="true">📋</div>
      <div>
        <h1>工作台</h1>
        <p class="sub">問題追蹤 · 指令筆記 · 私人空間</p>
      </div>
    </div>
    <div class="metrics">
      <div class="metric open"><span class="metric-val" id="openCount">0</span><span class="metric-label">待處理</span></div>
      <div class="metric done"><span class="metric-val" id="doneCount">0</span><span class="metric-label">已解決</span></div>
      <div class="metric note"><span class="metric-val" id="noteCount">0</span><span class="metric-label">筆記</span></div>
    </div>
  </header>

  <div class="shell">
    <div class="seg-tabs" role="tablist" aria-label="工作台分頁">
      <button class="seg-tab active" type="button" data-tab="issues" role="tab" aria-selected="true">問題追蹤</button>
      <button class="seg-tab" type="button" data-tab="notes" role="tab" aria-selected="false">指令 / 筆記</button>
    </div>

    <div class="panel">
      <div class="view active" id="view-issues">
        <div class="subview active" id="sub-overview">
          <div class="toolbar">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="osearch" placeholder="搜尋專案代號..." aria-label="搜尋專案代號">
            </div>
            <button class="btn ghost" type="button" id="exportBtn">匯出</button>
            <button class="btn ghost" type="button" id="importBtn">匯入</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
            <button class="btn primary" type="button" id="addBtnTop">+ 新增問題</button>
          </div>
          <div id="projList" class="proj-grid"></div>
        </div>

        <div class="subview" id="sub-detail">
          <div class="detail-header">
            <button class="btn back small" type="button" id="backBtn">← 返回</button>
            <h2 id="detailTitle"></h2>
            <span class="dcount" id="detailCount"></span>
          </div>
          <div class="toolbar">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="search" placeholder="搜尋標題或內容..." aria-label="搜尋問題">
            </div>
            <select id="filterStatus" class="filterselect" aria-label="篩選狀態">
              <option value="">全部狀態</option>
              <option value="open">未處理</option>
              <option value="progress">處理中</option>
              <option value="done">已解決</option>
            </select>
            <select id="filterCat" class="filterselect" aria-label="篩選分類">
              <option value="">全部分類</option>
            </select>
            <select id="sortIssues" class="filterselect" aria-label="排序方式">
              <option value="newest">最新優先</option>
              <option value="oldest">最舊優先</option>
              <option value="pri">優先度高→低</option>
              <option value="status">狀態排序</option>
            </select>
            <button class="btn primary" type="button" id="addBtn">+ 新增</button>
          </div>
          <div class="chip-row" id="statusChips" aria-label="快速狀態篩選"></div>

          <div class="form-panel" id="formPanel">
            <h3 class="form-title" id="formTitle">新增問題</h3>
            <div class="form-row">
              <div class="field"><label for="f-title">標題</label><input type="text" id="f-title" placeholder="簡述問題" required></div>
              <div class="field"><label for="f-proj">專案代號</label><input type="text" id="f-proj" placeholder="TP-5229"></div>
            </div>
            <div class="field"><label for="f-cat">分類</label><input type="text" id="f-cat" placeholder="工作 / 測試 / 專案"></div>
            <div class="form-row">
              <div class="field"><label for="f-pri">優先度</label>
                <select id="f-pri">
                  <option value="high">高</option>
                  <option value="med" selected>中</option>
                  <option value="low">低</option>
                </select>
              </div>
              <div class="field"><label for="f-status">狀態</label>
                <select id="f-status">
                  <option value="open">未處理</option>
                  <option value="progress">處理中</option>
                  <option value="done">已解決</option>
                </select>
              </div>
            </div>
            <div class="field"><label for="f-note">說明</label><textarea id="f-note" placeholder="詳細描述（選填）"></textarea></div>
            <div class="form-hint">Ctrl+Enter 儲存 · Esc 取消</div>
            <div class="form-actions">
              <button class="btn ghost" type="button" id="cancelBtn">取消</button>
              <button class="btn primary" type="button" id="saveBtn">儲存</button>
            </div>
          </div>

          <div id="list" class="card-list"></div>
        </div>
      </div>

      <div class="view" id="view-notes">
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="nsearch" placeholder="搜尋標題或內容..." aria-label="搜尋筆記">
          </div>
          <select id="nfilterCat" class="filterselect" aria-label="篩選筆記分類">
            <option value="">全部分類</option>
          </select>
          <select id="sortNotes" class="filterselect" aria-label="筆記排序">
            <option value="newest">最新優先</option>
            <option value="oldest">最舊優先</option>
            <option value="title">標題 A→Z</option>
          </select>
          <button class="btn primary" type="button" id="naddBtn">+ 新增筆記</button>
        </div>

        <div class="form-panel" id="nformPanel">
          <h3 class="form-title" id="nformTitle">新增筆記</h3>
          <div class="form-row">
            <div class="field"><label for="nf-title">標題</label><input type="text" id="nf-title" placeholder="JIRA 連線測試" required></div>
            <div class="field"><label for="nf-cat">分類</label><input type="text" id="nf-cat" placeholder="JIRA / GitHub / DB"></div>
          </div>
          <div class="field"><label for="nf-content">內容</label><textarea class="code" id="nf-content" placeholder="貼上指令、查詢語法..."></textarea></div>
          <label class="check-label"><input type="checkbox" id="nf-sensitive"> 含金鑰 / 憑證（會標示提醒）</label>
          <div class="form-hint">Ctrl+Enter 儲存 · Esc 取消</div>
          <div class="form-actions">
            <button class="btn ghost" type="button" id="ncancelBtn">取消</button>
            <button class="btn primary" type="button" id="nsaveBtn">儲存</button>
          </div>
        </div>

        <div id="nlist" class="card-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<div class="modal-backdrop" id="confirmModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">確認刪除</h3>
    <p id="confirmMessage">確定要刪除這筆資料嗎？此操作無法復原。</p>
    <div class="modal-actions">
      <button class="btn ghost" type="button" id="confirmCancel">取消</button>
      <button class="btn danger" type="button" id="confirmOk">刪除</button>
    </div>
  </div>
</div>

<script>
const ISSUE_KEY = 'issues-list';
const NOTE_KEY = 'notes-list';
const PRI_ORDER = { high: 0, med: 1, low: 2 };
const STATUS_ORDER = { open: 0, progress: 1, done: 2 };

let issues = [];
let notes = [];
let editingId = null;
let nEditingId = null;
let currentProject = null;
let pendingDelete = null;

const $ = (id) => document.getElementById(id);

const storageApi = {
  async get(key) {
    if (window.storage?.get) {
      const res = await window.storage.get(key, false);
      return res?.value ?? null;
    }
    return localStorage.getItem(key);
  },
  async set(key, value) {
    if (window.storage?.set) {
      await window.storage.set(key, value, false);
      return;
    }
    localStorage.setItem(key, value);
  },
};

function debounce(fn, wait = 200) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); };
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  $('toastWrap').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 200); }, 2200);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function priLabel(p) { return p === 'high' ? '高' : p === 'low' ? '低' : '中'; }

function statusMeta(s) {
  if (s === 'done') return { cls: 'done', label: '已解決' };
  if (s === 'progress') return { cls: 'progress', label: '處理中' };
  return { cls: 'open', label: '未處理' };
}

function nextCaseId() { return issues.length ? Math.max(...issues.map((i) => i.num || 0)) + 1 : 1; }
function nextNoteId() { return notes.length ? Math.max(...notes.map((i) => i.num || 0)) + 1 : 1; }

function updateTopStats() {
  $('openCount').textContent = issues.filter((i) => i.status !== 'done').length;
  $('doneCount').textContent = issues.filter((i) => i.status === 'done').length;
  $('noteCount').textContent = notes.length;
}

function rebuildSelectOptions(selectEl, options, currentValue) {
  const prev = currentValue ?? selectEl.value;
  selectEl.innerHTML = '<option value="">全部分類</option>' +
    options.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if (options.includes(prev)) selectEl.value = prev;
}

function sortIssues(list, mode) {
  const copy = [...list];
  if (mode === 'oldest') return copy.sort((a, b) => a.createdAt - b.createdAt);
  if (mode === 'pri') return copy.sort((a, b) => (PRI_ORDER[a.pri] ?? 9) - (PRI_ORDER[b.pri] ?? 9));
  if (mode === 'status') return copy.sort((a, b) => (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9));
  return copy.sort((a, b) => b.createdAt - a.createdAt);
}

function sortNotesList(list, mode) {
  const copy = [...list];
  if (mode === 'oldest') return copy.sort((a, b) => a.createdAt - b.createdAt);
  if (mode === 'title') return copy.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hant'));
  return copy.sort((a, b) => b.createdAt - a.createdAt);
}

function emptyHtml(msg) {
  return `<div class="empty"><div class="empty-icon">◇</div>${msg}</div>`;
}

async function loadAll() {
  $('projList').innerHTML = emptyHtml('載入中...');
  $('nlist').innerHTML = emptyHtml('載入中...');
  try { issues = JSON.parse(await storageApi.get(ISSUE_KEY) || '[]'); }
  catch { issues = []; toast('問題資料讀取失敗', 'err'); }
  try { notes = JSON.parse(await storageApi.get(NOTE_KEY) || '[]'); }
  catch { notes = []; toast('筆記資料讀取失敗', 'err'); }
  renderOverview();
  renderNotes();
}

async function saveIssues() {
  try { await storageApi.set(ISSUE_KEY, JSON.stringify(issues)); }
  catch { toast('問題儲存失敗', 'err'); }
}

async function saveNotes() {
  try { await storageApi.set(NOTE_KEY, JSON.stringify(notes)); }
  catch { toast('筆記儲存失敗', 'err'); }
}

function renderStatusChips(scoped) {
  const counts = { '': scoped.length, open: 0, progress: 0, done: 0 };
  scoped.forEach((i) => { counts[i.status] = (counts[i.status] || 0) + 1; });
  const current = $('filterStatus').value;
  const labels = { '': '全部', open: '未處理', progress: '處理中', done: '已解決' };
  $('statusChips').innerHTML = Object.keys(labels).map((k) =>
    `<button type="button" class="chip${current === k ? ' active' : ''}" data-status="${k}">${labels[k]} <span style="opacity:.6">${counts[k] || 0}</span></button>`
  ).join('');
}

function renderOverview() {
  const q = $('osearch').value.trim().toLowerCase();
  updateTopStats();

  const groups = {};
  issues.forEach((i) => { const key = i.proj || '__none__'; (groups[key] ||= []).push(i); });

  let keys = Object.keys(groups);
  if (q) keys = keys.filter((k) => (k === '__none__' ? '未歸類' : k).toLowerCase().includes(q));
  keys.sort((a, b) => { if (a === '__none__') return 1; if (b === '__none__') return -1; return a.localeCompare(b); });

  const projList = $('projList');
  if (!keys.length) {
    projList.innerHTML = emptyHtml('尚無專案<br>新增問題並填入專案代號，會自動建立資料夾');
    return;
  }

  projList.innerHTML = keys.map((k) => {
    const group = groups[k];
    const openN = group.filter((i) => i.status !== 'done').length;
    const doneN = group.filter((i) => i.status === 'done').length;
    const pct = group.length ? Math.round((doneN / group.length) * 100) : 0;
    const label = k === '__none__' ? '未歸類' : k;
    return `<button type="button" class="proj-card" data-project="${escapeHtml(k)}">
      <div class="pname"><span>${escapeHtml(label)}</span><span class="pct">${pct}%</span></div>
      <div class="pcounts">
        <span class="open">待處理 <b>${openN}</b></span>
        <span class="done-count">已解決 <b>${doneN}</b></span>
      </div>
      <div class="progress-bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
    </button>`;
  }).join('');
}

function openProject(key) {
  currentProject = key;
  $('sub-overview').classList.remove('active');
  $('sub-detail').classList.add('active');
  $('detailTitle').textContent = key === '__none__' ? '未歸類' : key;
  renderIssues();
}

function openForm(issue) {
  editingId = issue ? issue.id : null;
  $('formTitle').textContent = issue ? '編輯問題' : '新增問題';
  $('f-title').value = issue ? issue.title : '';
  const defaultProj = currentProject && currentProject !== '__none__' ? currentProject : '';
  $('f-proj').value = issue ? (issue.proj || '') : defaultProj;
  $('f-cat').value = issue ? issue.cat : '';
  $('f-pri').value = issue ? issue.pri : 'med';
  $('f-status').value = issue ? issue.status : 'open';
  $('f-note').value = issue ? issue.note : '';
  $('formPanel').classList.add('open');
  $('f-title').focus();
}

function closeForm() {
  $('formPanel').classList.remove('open');
  editingId = null;
}

function renderIssues() {
  if (currentProject === null) return;

  const q = $('search').value.trim().toLowerCase();
  const fStatus = $('filterStatus').value;
  const fCat = $('filterCat').value;
  const sortMode = $('sortIssues').value;

  const scoped = issues.filter((i) => (i.proj || '__none__') === currentProject);
  rebuildSelectOptions($('filterCat'), Array.from(new Set(scoped.map((i) => i.cat))).sort(), fCat);
  renderStatusChips(scoped);

  let filtered = scoped.filter((i) => {
    if (fStatus && i.status !== fStatus) return false;
    if (fCat && i.cat !== fCat) return false;
    if (q && !(i.title.toLowerCase().includes(q) || (i.note || '').toLowerCase().includes(q))) return false;
    return true;
  });
  filtered = sortIssues(filtered, sortMode);

  updateTopStats();
  $('detailCount').textContent = `${scoped.length} 件`;

  const list = $('list');
  if (!filtered.length) {
    list.innerHTML = emptyHtml('沒有符合條件的問題');
    return;
  }

  list.innerHTML = filtered.map((i) => {
    const sm = statusMeta(i.status);
    const priCls = i.pri === 'high' ? 'high' : i.pri === 'low' ? 'low' : 'med';
    return `<article class="card status-${i.status}${i.status === 'done' ? ' resolved' : ''}" data-id="${i.id}">
      <div class="card-top">
        <div>
          <div class="caseid">#${String(i.num).padStart(3, '0')}</div>
          <div class="card-title">${escapeHtml(i.title)}</div>
        </div>
        <span class="badge ${sm.cls}">${sm.label}</span>
      </div>
      ${i.note ? `<div class="card-note">${escapeHtml(i.note)}</div>` : ''}
      <div class="tags">
        <span class="tag cat">${escapeHtml(i.cat)}</span>
        <span class="tag pri-${priCls}">優先 ${priLabel(i.pri)}</span>
      </div>
      <div class="card-actions">
        <span class="card-date">${fmtDate(i.createdAt)}</span>
        <button class="btn small ghost" type="button" data-action="cycle" data-id="${i.id}">切換狀態</button>
        <button class="btn small ghost" type="button" data-action="edit-issue" data-id="${i.id}">編輯</button>
        <button class="btn small danger" type="button" data-action="delete-issue" data-id="${i.id}">刪除</button>
      </div>
    </article>`;
  }).join('');
}

function openNForm(note) {
  nEditingId = note ? note.id : null;
  $('nformTitle').textContent = note ? '編輯筆記' : '新增筆記';
  $('nf-title').value = note ? note.title : '';
  $('nf-cat').value = note ? note.cat : '';
  $('nf-content').value = note ? note.content : '';
  $('nf-sensitive').checked = note ? !!note.sensitive : false;
  $('nformPanel').classList.add('open');
  $('nf-title').focus();
}

function closeNForm() {
  $('nformPanel').classList.remove('open');
  nEditingId = null;
}

function renderNotes() {
  const q = $('nsearch').value.trim().toLowerCase();
  const fCat = $('nfilterCat').value;
  const sortMode = $('sortNotes').value;

  rebuildSelectOptions($('nfilterCat'), Array.from(new Set(notes.map((i) => i.cat))).sort(), fCat);

  let filtered = notes.filter((i) => {
    if (fCat && i.cat !== fCat) return false;
    if (q && !(i.title.toLowerCase().includes(q) || (i.content || '').toLowerCase().includes(q))) return false;
    return true;
  });
  filtered = sortNotesList(filtered, sortMode);
  updateTopStats();

  const list = $('nlist');
  if (!filtered.length) {
    list.innerHTML = emptyHtml('沒有符合條件的筆記');
    return;
  }

  list.innerHTML = filtered.map((i) => `<article class="card note-card" data-note-id="${i.id}">
    <div class="card-top">
      <div>
        <div class="caseid">#N${String(i.num).padStart(3, '0')}</div>
        <div class="card-title">${escapeHtml(i.title)}</div>
      </div>
      ${i.sensitive ? '<span class="badge warn">含憑證</span>' : ''}
    </div>
    <div class="codeblock">${escapeHtml(i.content)}</div>
    <div class="tags"><span class="tag ntag">${escapeHtml(i.cat)}</span></div>
    <div class="card-actions">
      <span class="card-date">${fmtDate(i.createdAt)}</span>
      <button class="btn small ghost" type="button" data-action="copy-note" data-id="${i.id}">複製</button>
      <button class="btn small ghost" type="button" data-action="edit-note" data-id="${i.id}">編輯</button>
      <button class="btn small danger" type="button" data-action="delete-note" data-id="${i.id}">刪除</button>
    </div>
  </article>`).join('');
}

function askDelete(message, onConfirm) {
  $('confirmMessage').textContent = message;
  $('confirmModal').classList.add('open');
  $('confirmModal').setAttribute('aria-hidden', 'false');
  pendingDelete = onConfirm;
}

function closeConfirm() {
  $('confirmModal').classList.remove('open');
  $('confirmModal').setAttribute('aria-hidden', 'true');
  pendingDelete = null;
}

async function deleteIssue(id) {
  const issue = issues.find((i) => i.id === id);
  askDelete(`確定刪除「${issue?.title || ''}」？`, async () => {
    issues = issues.filter((i) => i.id !== id);
    await saveIssues();
    renderIssues();
    renderOverview();
    toast('已刪除', 'ok');
  });
}

async function cycleStatus(id) {
  const idx = issues.findIndex((i) => i.id === id);
  if (idx < 0) return;
  const order = ['open', 'progress', 'done'];
  issues[idx].status = order[(order.indexOf(issues[idx].status) + 1) % order.length];
  await saveIssues();
  renderIssues();
  renderOverview();
  toast(`→ ${statusMeta(issues[idx].status).label}`, 'ok');
}

function editIssue(id) { const issue = issues.find((i) => i.id === id); if (issue) openForm(issue); }

async function deleteNote(id) {
  const note = notes.find((i) => i.id === id);
  askDelete(`確定刪除「${note?.title || ''}」？`, async () => {
    notes = notes.filter((i) => i.id !== id);
    await saveNotes();
    renderNotes();
    toast('已刪除', 'ok');
  });
}

function editNote(id) { const note = notes.find((i) => i.id === id); if (note) openNForm(note); }

async function copyNote(id) {
  const note = notes.find((i) => i.id === id);
  if (!note) return;
  try { await navigator.clipboard.writeText(note.content); toast('已複製', 'ok'); }
  catch { toast('複製失敗', 'err'); }
}

function exportData() {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), issues, notes }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workbench-${fmtDate(Date.now())}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已匯出', 'ok');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.issues) || !Array.isArray(data.notes)) throw new Error();
      askDelete('匯入會覆蓋現有資料，確定繼續？', async () => {
        issues = data.issues;
        notes = data.notes;
        await saveIssues();
        await saveNotes();
        currentProject = null;
        $('sub-detail').classList.remove('active');
        $('sub-overview').classList.add('active');
        renderOverview();
        renderNotes();
        toast('匯入完成', 'ok');
      });
    } catch { toast('檔案格式錯誤', 'err'); }
  };
  reader.readAsText(file);
}

document.querySelectorAll('.seg-tab').forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll('.seg-tab').forEach((x) => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    document.querySelectorAll('.view').forEach((x) => x.classList.remove('active'));
    tab.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    $('view-' + tab.dataset.tab).classList.add('active');
  };
});

$('osearch').oninput = debounce(renderOverview);
$('search').oninput = debounce(renderIssues);
$('filterStatus').onchange = renderIssues;
$('filterCat').onchange = renderIssues;
$('sortIssues').onchange = renderIssues;
$('nsearch').oninput = debounce(renderNotes);
$('nfilterCat').onchange = renderNotes;
$('sortNotes').onchange = renderNotes;

$('statusChips').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-status]');
  if (!chip) return;
  $('filterStatus').value = chip.dataset.status;
  renderIssues();
});

$('projList').addEventListener('click', (e) => {
  const card = e.target.closest('[data-project]');
  if (card) openProject(card.dataset.project);
});

$('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  if (action === 'cycle') cycleStatus(id);
  if (action === 'edit-issue') editIssue(id);
  if (action === 'delete-issue') deleteIssue(id);
});

$('nlist').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, id } = btn.dataset;
  if (action === 'copy-note') copyNote(id);
  if (action === 'edit-note') editNote(id);
  if (action === 'delete-note') deleteNote(id);
});

$('addBtnTop').onclick = () => {
  $('sub-overview').classList.remove('active');
  $('sub-detail').classList.add('active');
  $('detailTitle').textContent = '新增問題';
  $('detailCount').textContent = '';
  $('list').innerHTML = '';
  currentProject = null;
  openForm(null);
};

$('backBtn').onclick = () => {
  currentProject = null;
  closeForm();
  $('sub-detail').classList.remove('active');
  $('sub-overview').classList.add('active');
  renderOverview();
};

$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = () => {
  closeForm();
  if (currentProject === null) {
    $('sub-detail').classList.remove('active');
    $('sub-overview').classList.add('active');
    renderOverview();
  }
};

$('saveBtn').onclick = async () => {
  const title = $('f-title').value.trim();
  if (!title) { $('f-title').focus(); toast('請填寫標題', 'err'); return; }
  const data = {
    title,
    proj: $('f-proj').value.trim(),
    cat: $('f-cat').value.trim() || '未分類',
    pri: $('f-pri').value,
    status: $('f-status').value,
    note: $('f-note').value.trim(),
  };
  if (editingId) {
    issues[issues.findIndex((i) => i.id === editingId)] = { ...issues.find((i) => i.id === editingId), ...data };
    toast('已更新', 'ok');
  } else {
    issues.unshift({ id: 'iss_' + Date.now(), num: nextCaseId(), createdAt: Date.now(), ...data });
    toast('已新增', 'ok');
  }
  await saveIssues();
  closeForm();
  const key = data.proj || '__none__';
  currentProject = key;
  $('sub-overview').classList.remove('active');
  $('sub-detail').classList.add('active');
  $('detailTitle').textContent = key === '__none__' ? '未歸類' : key;
  renderIssues();
  renderOverview();
};

$('naddBtn').onclick = () => openNForm(null);
$('ncancelBtn').onclick = closeNForm;

$('nsaveBtn').onclick = async () => {
  const title = $('nf-title').value.trim();
  if (!title) { $('nf-title').focus(); toast('請填寫標題', 'err'); return; }
  const data = {
    title,
    cat: $('nf-cat').value.trim() || '未分類',
    content: $('nf-content').value,
    sensitive: $('nf-sensitive').checked,
  };
  if (nEditingId) {
    notes[notes.findIndex((i) => i.id === nEditingId)] = { ...notes.find((i) => i.id === nEditingId), ...data };
    toast('已更新', 'ok');
  } else {
    notes.unshift({ id: 'note_' + Date.now(), num: nextNoteId(), createdAt: Date.now(), ...data });
    toast('已新增', 'ok');
  }
  await saveNotes();
  closeNForm();
  renderNotes();
};

$('exportBtn').onclick = exportData;
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = (e) => { const f = e.target.files?.[0]; if (f) importData(f); e.target.value = ''; };
$('confirmCancel').onclick = closeConfirm;
$('confirmOk').onclick = async () => { const fn = pendingDelete; closeConfirm(); if (fn) await fn(); };
$('confirmModal').onclick = (e) => { if (e.target === $('confirmModal')) closeConfirm(); };

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('confirmModal').classList.contains('open')) { closeConfirm(); return; }
    if ($('formPanel').classList.contains('open')) { $('cancelBtn').click(); return; }
    if ($('nformPanel').classList.contains('open')) closeNForm();
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    if ($('formPanel').classList.contains('open')) $('saveBtn').click();
    if ($('nformPanel').classList.contains('open')) $('nsaveBtn').click();
  }
});

loadAll();
</script>
</body>
</html>
